<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Old Pub 77 — Cardápio</title>
<style>
body{margin:0;background:#070707;color:#f5f1e8;font-family:Arial,sans-serif}
header{background:#0a0a0a;border-bottom:1px solid #5b421e;text-align:center;padding:20px 12px;position:sticky;top:0}
h1{margin:0;color:#d0a04a;font-family:Georgia,serif;font-size:42px}
main{max-width:900px;margin:auto;padding:18px 12px 50px}
h2{color:#d0a04a;border-bottom:1px solid #5b421e;padding-bottom:8px}
.item{border:1px solid #3f311d;border-radius:10px;padding:12px;margin:9px 0;background:#0e0e0e}
.top{display:flex;gap:10px;align-items:center}.tap{border:1px solid #d0a04a;color:#d0a04a;border-radius:7px;padding:8px;font-weight:700}
.name{font-weight:700;font-size:18px}.meta{color:#bcb5aa;font-size:12px;margin:5px 0 8px 54px}
.prices{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-left:54px;text-align:center}
.prices div{border-top:1px solid #30281e;padding-top:7px;color:#d0a04a;font-weight:700}.prices small{display:block;color:#999}
.row{display:flex;justify-content:space-between;gap:16px;border-bottom:1px solid #28231c;padding:11px 2px}.row:last-child{border:0}.row b{color:#d0a04a;white-space:nowrap}
@media(max-width:520px){h1{font-size:34px}.name{font-size:16px}.prices,.meta{margin-left:0}.item{padding:10px}}
</style>
</head>
<body>
<header><h1>The Old Pub 77</h1><div>Cardápio Digital</div></header>
<main>
<h2>Chopps</h2>
<div id="beers"></div>
<h2>Porções</h2>

<h2>Bebidas</h2>

</main>

</script>
</body>
</html>
